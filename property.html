<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=finance.html#property">
  <title>Redirecting to Sovereign Capital & Property Hub — Sikander OS</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    const h = window.location.hash || '#property';
    window.location.replace('finance.html' + h);
  </script>
  <style>
    body {
      background: #07090e;
      color: #f1f5f9;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .redirect-card {
      background: rgba(15, 20, 32, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 20px;
      padding: 44px 36px;
      max-width: 520px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 35px rgba(245, 158, 11, 0.1);
      backdrop-filter: blur(20px);
    }
    .redirect-icon {
      font-size: 52px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #fff;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    a.btn-redirect {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #050811;
      font-weight: 800;
      font-size: 14px;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn-redirect:hover {
      transform: scale(1.03);
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="redirect-icon">🏢</div>
    <h1>Sovereign Capital & Property Hub</h1>
    <p>The Al Ghafoor Unit 206 Property Ledger has been seamlessly consolidated into the unified <strong>Module 05: Sovereign Capital, Property & Banking Hub</strong> (<code>finance.html#property</code>).</p>
    <a href="finance.html#property" class="btn-redirect" id="manual-link">
      <span>Continue to Capital & Property Hub ↗</span>
    </a>
  </div>
  <script>
    const deepHash = window.location.hash || '#property';
    document.getElementById('manual-link').href = 'finance.html' + deepHash;
    window.location.replace('finance.html' + deepHash);
  </script>
</body>
</html>
