<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Gem Gradient -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Inner Facet Light -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0faff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Obsidian Rounded Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.85"/>

  <!-- Subtle Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gemGrad)" stroke-width="2" opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Centered Floating Gem Tile with Shadow & Glow -->
  <g filter="url(#deepShadow)">
    <rect x="106" y="106" width="300" height="300" rx="72" fill="url(#gemGrad)" filter="url(#cyanGlow)"/>
    
    <!-- Top-Left Gloss Accent -->
    <path d="M 112 178 C 112 140, 140 112, 178 112 L 334 112 C 290 120, 160 160, 112 280 Z" fill="url(#facetLight)"/>
    
    <!-- Inner Fine Border -->
    <rect x="108" y="108" width="296" height="296" rx="70" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Precision High-Tech Lightning Bolt Glyph -->
  <g filter="url(#deepShadow)">
    <polygon points="276,146 176,274 252,274 236,366 336,238 260,238" fill="url(#boltGrad)"/>
    <!-- Bolt Inner Highlight Line -->
    <polyline points="274,154 186,268 250,268 238,354" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
  </g>

  <!-- Orbiting Telemetry Indicator Dots -->
  <circle cx="256" cy="62" r="4" fill="#00f2fe" opacity="0.8"/>
  <circle cx="450" cy="256" r="4" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="256" cy="450" r="4" fill="#00f2fe" opacity="0.8"/>
  <circle cx="62" cy="256" r="4" fill="#8b5cf6" opacity="0.8"/>
</svg>
